  function openProductModal(){const f=document.getElementById('productForm');f.reset();f.productId.value='';document.getElementById('productCategory').innerHTML=categoryOptions('');document.getElementById('productUnit').value='—à—Ç.';document.getElementById('productWeekly').value='1';document.getElementById('productStock').value='0';refreshProductSteps();document.getElementById('productModalTitle').textContent='–ù–æ–≤—ã–π –ø—Ä–æ–¥—É–∫—Ç';openModal('productModal')}
  function editProduct(id){const p=state.products.find(x=>x.productId===id);if(!p)return;const f=document.getElementById('productForm');f.reset();document.getElementById('productCategory').innerHTML=categoryOptions(p.category||'');f.elements.productId.value=p.productId;f.elements.name.value=p.name||'';f.elements.category.value=p.category||'';f.elements.pack.value=p.unit||'—à—Ç.';f.elements.daysSupply.value=p.daysSupply||'';f.elements.weeklyTarget.value=qinput(p.weeklyTarget,p.unit);f.elements.currentStock.value=qinput(p.currentStock,p.unit);f.elements.price.value=p.price||'';f.elements.note.value=p.note||'';refreshProductSteps();document.getElementById('productModalTitle').textContent='–ò–∑–º–µ–Ω–∏—Ç—å –ø—Ä–æ–¥—É–∫—Ç';openModal('productModal')}
  function refreshProductSteps(){const unit=document.getElementById('productUnit').value,step=unitStep(unit);['productWeekly','productStock'].forEach(id=>{const el=document.getElementById(id);el.step=step;el.value=qinput(qnum(el.value,unit),unit)})}

  function renderSettings(){if(!state?.settings)return;const f=document.getElementById('settingsForm'),s=state.settings,c=s.stockColumns;f.elements.lowStockPercent.value=s.lowStockPercent;document.getElementById('lowStockValue').textContent=s.lowStockPercent+'%';f.elements.groupMode.value=s.stockGroupMode;f.elements.kgStep.value=String(s.kgStep||0.1);f.elements.showUnit.checked=!!c.unit;f.elements.showWeeklyTarget.checked=!!c.weeklyTarget;f.elements.showRemaining.checked=!!c.remaining;f.elements.showToBuy.checked=!!c.toBuy;f.elements.showLastPurchase.checked=!!c.lastPurchase;f.elements.showStatus.checked=!!c.status}

  function openPurchaseModal(){
    if(!(state.basket||[]).length){toast('–ö–æ—Ä–∑–∏–Ω–∞ –ø—É—Å—Ç–∞',true);return}
    const s=basketDraftSummary();
    const store=draftStore();
    const storeId=basketDraftStoreId||'';
    const key=storeId||'NO_STORE';
    const name=store?store.name:'–ü–æ–∫—É–ø–∫–∞';
    document.getElementById('purchaseFields').innerHTML=`<div class="mini-card"><strong>${esc(name)}</strong><div class="row-sub" style="margin-top:5px">–ö—ç—à–±—ç–∫ ${esc(basketDraftCashbackPercent)}% ¬∑ ${basketDraftCashbackLimit>0?'–ª–∏–º–∏—Ç '+money(basketDraftCashbackLimit):'–±–µ–∑ –ª–∏–º–∏—Ç–∞'} ¬∑ –∏–∑ –∫–æ—Ä–∑–∏–Ω—ã</div><div class="form-grid" style="margin-top:11px"><div class="field"><label>–§–∞–∫—Ç–∏—á–µ—Å–∫–∞—è —Å—É–º–º–∞, ‚ÇΩ</label><input type="number" step="0.01" name="actual_${esc(key)}" value="${Number(s.total)||0}" oninput="refreshPurchaseCashback()"></div><div class="field"><label>–°–∫–∏–¥–∫–∞, ‚ÇΩ</label><input type="number" step="0.01" name="discount_${esc(key)}" value="0"></div><div class="field"><label>–ö—ç—à–±—ç–∫ –ø–æ –ø–æ–∫—É–ø–∫–µ</label><input id="purchaseCashbackPreview" value="${money(s.cashback)}" disabled></div><div class="field"><label>–ü–æ—Å–ª–µ –∫—ç—à–±—ç–∫–∞</label><input id="purchaseNetPreview" value="${money(s.effective)}" disabled></div></div></div>`;
    openModal('purchaseModal');
    refreshPurchaseCashback();
  }




  function refreshPurchaseCashback(){
    const actual=document.querySelector('#purchaseFields input[name^="actual_"]');
    const cashback=document.getElementById('purchaseCashbackPreview');
    const net=document.getElementById('purchaseNetPreview');
    if(!actual||!cashback||!net)return;
    const total=Math.max(0,rawNumber(actual.value));
    const value=draftCashback(total);
    cashback.value=money(value);
    net.value=money(Math.max(0,total-value));
  }




  async function submitPurchase(e){
    e.preventDefault();
    if(!(state.basket||[]).length){toast('–ö–æ—Ä–∑–∏–Ω–∞ –ø—É—Å—Ç–∞',true);return}
    const fd=new FormData(e.target);
    const key=basketDraftStoreId||'NO_STORE';
    const actualsByStore={};
    actualsByStore[key]={
      actualTotal:fd.get('actual_'+key),
      discount:fd.get('discount_'+key)
    };
    const request={
      draft:{storeId:basketDraftStoreId,items:collectBasketDraftItems()},
      cashbackPercent:basketDraftCashbackPercent,
      cashbackLimit:basketDraftCashbackLimit,
      actualsByStore
    };
    setLoading(true);
    try{
      state=await api('completePurchase',request);
      basketDirty=false;
      basketDraftCashbackPercent=0;
      basketDraftCashbackLimit=0;
      resetBasketDraft(true);
      closeModal('purchaseModal');
      renderAll();
      showPage('history');
      toast('–ü–æ–∫—É–ø–∫–∞ —Å–æ—Ö—Ä–∞–Ω–µ–Ω–∞');
    }catch(err){toast(err.message,true)}
    finally{setLoading(false)}
  }




  function openModal(id){document.getElementById(id).classList.add('open')}
  function closeModal(id){document.getElementById(id).classList.remove('open')}
  function formObject(form){return Object.fromEntries(new FormData(form).entries())}
