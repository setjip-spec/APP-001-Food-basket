name: Validate APP-001

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Supabase cloud adapter syntax
        run: node --check cloud-backend.js

      - name: Check GitHub Pages loader JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          pathlib.Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Check legacy Apps Script recovery source
        shell: bash
        run: |
          cat src/*_Server.gs > /tmp/server.js
          node --check /tmp/server.js
          cat src/Script*.html > /tmp/ui.js
          node --check /tmp/ui.js

      - name: Check required GitHub Pages files
        shell: bash
        run: |
          test -f index.html
          test -f cloud-backend.js
          test -f .nojekyll
          test -f src/Style01.html
          test -f src/Body01.html
          test -f src/Script01.html
