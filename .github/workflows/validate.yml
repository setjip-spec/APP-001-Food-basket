name: Validate APP-001

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Apps Script server syntax
        shell: bash
        run: |
          cat src/*_Server.gs > /tmp/server.js
          node --check /tmp/server.js

      - name: Check UI JavaScript syntax
        shell: bash
        run: |
          cat src/Script*.html > /tmp/ui.js
          node --check /tmp/ui.js

      - name: Check required Apps Script files
        shell: bash
        run: |
          test -f src/Index.html
          test -f src/Style01.html
          test -f src/Body01.html
          test -f appsscript.json
