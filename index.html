<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f1ea">
  <title>APP-001 — Продуктовая корзина</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f3f1ea;font-family:Arial,sans-serif}
    #bootScreen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:#f3f1ea;color:#555850;padding:30px;text-align:center;box-sizing:border-box}
    #bootScreen.error{color:#9f3030}
    .auth-gate{position:fixed;inset:0;background:rgba(243,241,234,.97);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
    .auth-gate.open{display:flex}.auth-card{width:min(420px,100%);background:#fffdfa;border:1px solid #c9c3b6;border-radius:14px;padding:24px;box-shadow:0 18px 48px rgba(0,0,0,.08);box-sizing:border-box}
    .auth-card h2{margin:0 0 6px}.auth-card p{margin:0 0 18px;color:#73756d;font-size:13px}.auth-card .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
    .auth-card label{font-size:12px;font-weight:700;color:#65665e}.auth-card input{width:100%;border:1px solid #d3cdc0;border-radius:8px;background:#fff;padding:10px;box-sizing:border-box;font:inherit}
    .auth-card button{width:100%;border:1px solid #66701e;background:#66701e;color:#fff;padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}
    .auth-card button:disabled{opacity:.5}.auth-error{min-height:20px;color:#b93434;font-size:12px;margin:8px 0}
    .cloud-user-badge{position:fixed;right:16px;bottom:16px;z-index:40;background:#fffdf9;border:1px solid #c9c3b6;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,.06);font-size:11px}
    .cloud-user-badge[hidden]{display:none}.cloud-user-badge button{border:0;background:transparent;color:#505817;font-weight:700;cursor:pointer;padding:4px}
  </style>
</head>
<body>
  <div id="bootScreen">Загрузка приложения…</div>
  <div class="auth-gate" id="authGate">
    <form class="auth-card" id="authForm">
      <h2>Продуктовая корзина</h2>
      <p>Войдите в свой облачный профиль. Данные хранятся в Supabase и синхронизируются между устройствами.</p>
      <div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Пароль</label><input name="password" type="password" autocomplete="current-password" required></div>
      <div class="auth-error" id="authError"></div>
      <button type="submit">Войти</button>
    </form>
  </div>
  <div class="cloud-user-badge" id="cloudUserBadge" hidden><span id="cloudUserEmail"></span><button type="button" onclick="cloudSignOut()">Выйти</button></div>
  <div id="appMount"></div>

  <script>
  (async()=>{
    const boot=document.getElementById('bootScreen');
    const VERSION='20260907-bootfix3';
    const loadScript=src=>new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=src;
      s.onload=resolve;
      s.onerror=()=>reject(new Error('Не загрузился скрипт: '+src));
      document.head.appendChild(s);
    });
    try{
      try{
        await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      }catch(firstError){
        console.warn(firstError);
        await loadScript('https://unpkg.com/@supabase/supabase-js@2');
      }
      if(!window.supabase?.createClient)throw new Error('Библиотека Supabase не загрузилась');
      await loadScript('./cloud-backend.js?v='+VERSION);
      if(typeof window.bootCloud!=='function' || typeof window.cloudApi!=='function')throw new Error('Cloud backend не инициализировался');

      const base='./src/';
      const names=['Style01.html','Body01.html','Script01.html','Script02.html','Script03.html','Script04.html','Script05.html','Script06.html','Script07.html','Script08.html'];
      const files=await Promise.all(names.map(async name=>{
        const r=await fetch(base+name+'?v='+VERSION,{cache:'no-store'});
        if(!r.ok)throw new Error(name+': HTTP '+r.status);
        return r.text();
      }));
      const [css,body,...scripts]=files;
      const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
      document.getElementById('appMount').innerHTML=body;

      // ВАЖНО: Script01..08 — это части одного исходного JS и некоторые границы
      // проходят прямо внутри идентификаторов/шаблонных строк. Нельзя вставлять между
      // частями даже перевод строки — исходник должен быть восстановлен байт-в-байт.
      let js=scripts.join('');
      const oldApi="function api(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err&&err.message?err.message:String(err))))[name](...args));}";
      if(!js.includes(oldApi))throw new Error('Не найден legacy API adapter');
      js=js.replace(oldApi,"function api(name,...args){return cloudApi(name,args);}");

      const startup=/document\.addEventListener\('DOMContentLoaded',\(\)=>\{([\s\S]*?)\r?\n\s*loadState\(\);\r?\n\s*\}\);/;
      const match=js.match(startup);
      if(!match)throw new Error('Не найден блок запуска приложения');
      js=js.replace(startup,`function initApp(){${match[1]}\n    bootCloud();\n  }`);

      // Сначала отдельно проверяем синтаксис, чтобы ошибка не превращалась в «мёртвую» страницу.
      try{new Function(js)}catch(parseError){throw new Error('Ошибка JavaScript интерфейса: '+parseError.message)}

      const script=document.createElement('script');
      script.textContent=js;
      document.body.appendChild(script);
      if(typeof window.initApp!=='function')throw new Error('Основной интерфейс не инициализировался');
      window.initApp();
      boot.remove();
    }catch(err){
      console.error(err);
      boot.classList.add('error');
      boot.textContent='Ошибка запуска APP-001: '+(err?.message||err);
    }
  })();
  </script>
</body>
</html>
